schema_version: 1

context:
  name: variable_inspector
  version: "1.4.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/variable_inspector-${{ version }}.tar.gz
  sha256: 225407d89660f33c344203e5f7140af92ddc91045d8cbacb7a59f9d103f32f9c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.5.0,<1.32
    - jupyterlab >=4.4.0,<5
    - hatch-nodejs-version >=0.3.2
    - pip
    # Hidden in tool.hatch.build.hooks.jupyter-builder.dependencies
    - hatch-jupyter-builder >=0.5
  run:
    - python >=${{ python_min }}
    - jupyterlab >=4.2,<5

tests:
  - python:
      imports:
        - variable_inspector
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/mljar/variable-inspector
  summary: Variable inspector for jupyter lab.
  license: AGPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
